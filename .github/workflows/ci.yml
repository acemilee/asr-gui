name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: python -m ruff check asr_gui tests
      - name: Byte-compile every module
        run: python -m compileall -q asr_gui tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # tkinter 在部分 Linux 镜像里是单独打包的；装不上时 GUI 结构测试会自动跳过。
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk || true

      # 测试套件刻意只依赖 numpy + av + pytest：模型（sherpa-onnx / faster-whisper）
      # 在代码里是延迟导入的，所以 CI 不需要下载几个 GB 的权重和推理库。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "av>=13,<20" pytest

      - name: Pytest
        run: python -m pytest tests -q

  bat:
    name: bat files are ascii+crlf
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check .bat encoding (see docs/lessons.md #7)
        run: python -m pytest tests/test_app_contract.py -q
