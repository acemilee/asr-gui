name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: python -m ruff check asr_gui tests
      - name: Byte-compile every module
        run: python -m compileall -q asr_gui tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # tkinter 在部分 Linux 镜像里是单独打包的；装不上时 GUI 结构测试会自动跳过。
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk || true

      # 测试套件刻意只依赖 numpy + av + pytest：模型（sherpa-onnx / faster-whisper）
      # 在代码里是延迟导入的，所以 CI 不需要下载几个 GB 的权重和推理库。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy "av>=13,<20" pytest

      - name: Pytest
        run: python -m pytest tests -q

  bat:
    name: bat files are ascii+crlf
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 只用标准库：这个 job 不装 pytest/numpy，专门守住 .bat 的编码契约
      # （cmd.exe 遇到 LF-only + UTF-8 中文的 .bat 会把 if(...) 块解析乱，见 docs/lessons.md #7）。
      # 同样的断言也在 tests/test_app_contract.py 里，这里是更早、更便宜的独立信号。
      - name: Check .bat encoding
        shell: python
        run: |
          import pathlib
          import sys

          problems = []
          files = sorted(pathlib.Path(".").glob("*.bat")) + sorted(pathlib.Path("asr_gui").glob("*.bat"))
          if not files:
              problems.append("no .bat files found")
          for path in files:
              data = path.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  problems.append(f"{path}: has a UTF-8 BOM")
              if b"\r\n" not in data:
                  problems.append(f"{path}: no CRLF line endings")
              if data.replace(b"\r\n", b"").count(b"\n"):
                  problems.append(f"{path}: contains lone LF")
              if data.replace(b"\r\n", b"").count(b"\r"):
                  problems.append(f"{path}: contains lone CR")
              non_ascii = [b for b in data if b > 0x7F]
              if non_ascii:
                  problems.append(f"{path}: {len(non_ascii)} non-ASCII bytes")

          for path in files:
              print(f"{path}: {len(path.read_bytes())} bytes, ascii+crlf ok")
          if problems:
              print("\n".join(problems))
              sys.exit(1)
